[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "legal-document-processor"
version = "0.1.0"
description = "Local-first court document extraction, renaming, and spreadsheet reporting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brad Zeitner" }]
dependencies = [
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<5",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
  "rapidocr-onnxruntime>=1.4,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "reportlab>=4,<5",
]

[project.scripts]
document-processor = "document_processor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/document_processor"]

[tool.hatch.build.targets.wheel.force-include]
"schema/field_schema.yaml" = "document_processor/data/field_schema.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
