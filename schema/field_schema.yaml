schema_version: 1
description: >-
  Canonical extraction schema derived from field_list. Common fields apply to
  every recognized document type; type-specific fields extend that set.

required_naming_fields:
  - document_date
  - case_number
  - primary_party
  - document_type

common_fields:
  court_name: Court name
  court_county: Court county or jurisdiction
  case_number: Case or cause number
  case_title: Case title or caption
  plaintiff_names: Plaintiff or petitioner names
  defendant_names: Defendant or respondent names
  document_title: Document title as printed
  document_date: Best substantive document date
  filing_date: Filing date
  filing_time: Filing time
  filing_status: Filing status or stamp
  clerk_name: Clerk name
  attorney_names: Attorney names
  law_firm: Law firm or organization
  attorney_bar_numbers: Attorney bar membership numbers
  attorney_address: Attorney mailing address
  attorney_phone: Attorney telephone
  attorney_fax: Attorney fax
  attorney_email: Attorney email
  signatures: Signers and signatures
  page_number: Printed page number
  filing_identifier: Document code, barcode, or filing identifier

document_types:
  case_information_cover_sheet:
    label: Case Information Cover Sheet
    filename_label: Case-Information-Cover-Sheet
    aliases:
      - Case Information Cover Sheet
      - CICS
    fields:
      case_type: Civil or other case type
      cause_of_action_category: Selected cause-of-action category or code
      cause_of_action_description: Other cause-of-action description

  summons:
    label: Summons
    filename_label: Summons
    aliases:
      - SUMMONS
    fields:
      response_deadline_date: Written-response deadline date
      response_deadline_time: Written-response deadline time
      addressee_name: Addressee or tenant name
      service_address: Service address
      court_date: Court date
      response_instructions: Instructions for responding
      filing_address: Court or clerk filing address
      court_business_hours: Court business hours
      permitted_delivery_methods: Permitted response-delivery methods
      legal_aid_contacts: Legal-aid contacts, telephone numbers, and websites

  complaint_unlawful_detainer:
    label: Complaint for Unlawful Detainer
    filename_label: Complaint-for-Unlawful-Detainer
    aliases:
      - COMPLAINT FOR UNLAWFUL DETAINER
    fields:
      landlord_name: Landlord or property owner
      tenant_name: Tenant name
      property_address: Rental-property address and unit
      lease_date: Lease date
      lease_terms_at_issue: Lease terms or rules at issue
      accommodation_facts: Disability or reasonable-accommodation facts
      accommodation_schedule: Accommodation schedule
      warning_dates: Warning-letter dates
      incident_dates: Incident or surveillance dates
      notice_type: Notice type
      notice_date: Notice date
      notice_service_methods: Notice service methods
      compliance_deadline: Compliance or vacate deadline
      continued_possession_status: Continued-possession status
      statutory_authority: Statutory cause or authority
      requested_relief: Requested relief

  motion_order_show_cause:
    label: Motion for Order to Show Cause
    filename_label: Motion-for-Order-to-Show-Cause
    aliases:
      - MOTION FOR ORDER TO SHOW CAUSE
    fields:
      statutory_authority: Statutory authority
      requested_hearing_relief: Requested hearing or show-cause relief
      property_address: Property address
      lease_date: Lease date
      accommodation_facts: Disability or accommodation facts
      accommodation_schedule: Accommodation terms and schedule
      warning_dates: Warning-letter dates
      incident_dates: Incident or surveillance dates
      notice_date: Notice-to-comply-or-vacate date
      notice_service_methods: Notice service methods
      compliance_period: Compliance period
      continued_possession_status: Continued possession or noncompliance
      requested_relief: Requested order and writ relief

  fact_declaration:
    label: Declaration
    filename_label: Declaration
    aliases:
      - DECLARATION OF
      - DECLARATION
    fields:
      declarant_name: Declarant name
      declarant_role: Declarant title or relationship to a party
      declarant_qualifications: Age, citizenship, competency, or knowledge statement
      property_address: Property address and unit
      tenant_name: Tenant name
      lease_date: Lease date
      factual_chronology: Relevant facts or chronology
      accommodation_facts: Disability or accommodation facts
      warning_dates: Warning or notice dates
      incident_dates: Alleged incident dates
      mailing_dates: Mailing dates
      service_dates: Service or posting dates
      recipient_name: Recipient name
      recipient_address: Recipient address
      documents_served: Documents mailed or served
      exhibit_references: Exhibit references
      perjury_declaration: Declaration under penalty of perjury
      signed_date: Signed date
      signed_location: Signed location

  order_show_cause:
    label: Order to Show Cause
    filename_label: Order-to-Show-Cause
    aliases:
      - ORDER TO SHOW CAUSE
    fields:
      hearing_date: Hearing date
      hearing_time: Hearing time
      courtroom: Courtroom number
      courthouse_address: Courthouse address
      property_address: Property subject to restitution
      statutory_authority: Statutory authority
      required_appearance: Required appearance or response
      virtual_hearing_platform: Virtual-hearing platform
      virtual_hearing_id: Meeting or courtroom ID
      virtual_hearing_link: Virtual-hearing link
      virtual_hearing_passcode: Virtual-hearing passcode
      judicial_officer: Judicial-officer name and title

  declaration_mailing:
