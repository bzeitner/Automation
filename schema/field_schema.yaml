      opposing_counsel: Opposing counsel
      client_recipient: Client or party recipient
      withdrawing_attorney: Withdrawing attorney
      withdrawing_organization: Withdrawing attorney organization
      effective_date: Withdrawal effective date
      objection_deadline: Objection deadline or condition
      hearing_type: Scheduled hearing type
      hearing_date: Hearing date
      hearing_time: Hearing time
      client_last_known_address: Client last-known address

  certificate_service:
    label: Certificate of Service
    filename_label: Certificate-of-Service
    aliases:
      - CERTIFICATE OF SERVICE
    fields:
      service_date: Service date
      documents_served: Documents served
      recipient_name: Recipient name
      recipient_role: Recipient role or counsel status
      recipient_address: Recipient address
      recipient_fax: Recipient fax number
      service_methods: Service methods
      certification_text: Certification or perjury statement
      signed_date: Signed date
      signed_location: Signed location
      signer_name: Signer name
      signer_role: Signer role

  motion_hearing_minute_sheet:
    label: Motion Hearing Minute Sheet
    filename_label: Motion-Hearing-Minute-Sheet
