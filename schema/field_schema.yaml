    filename_label: Declaration-of-Mailing
    aliases:
      - DECLARATION OF MAILING
    fields:
      declarant_name: Declarant name
      declarant_qualifications: Declarant qualifications
      mailing_date: Mailing date
      mailing_location: Mailing or signing location
      recipient_name: Recipient name
      recipient_role: Recipient role or counsel status
      recipient_firm: Recipient firm
      recipient_address: Recipient mailing address
      mailing_methods: Mailing methods
      enclosed_documents: Enclosed documents
      exhibit_references: Mailing, posting, or service exhibits
      perjury_declaration: Declaration under penalty of perjury

  answer:
    label: Answer
    filename_label: Answer
    aliases:
      - ANSWER
    fields:
      answering_party: Defendant or respondent filing the answer

  notice_appearance:
    label: Notice of Appearance
    filename_label: Notice-of-Appearance
    aliases:
      - Notice of Appearance
      - NOTICE OF APPEARANCE
    fields:
      recipient_clerk: Clerk recipient
      opposing_counsel: Opposing attorney or firm
      appearing_party: Appearing party
      appearing_attorney: Appearing attorney
      service_request: Request that future papers be served on counsel

  notice_intent_withdraw:
    label: Notice of Intent to Withdraw
    filename_label: Notice-of-Intent-to-Withdraw
    aliases:
      - Notice of Intent to Withdraw
      - NOTICE OF INTENT TO WITHDRAW
    fields:
