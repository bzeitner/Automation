      court_reporter: Court reporter or recording method
      courtroom: Courtroom
      court_clerk: Court clerk
      hearing_date: Hearing date
      plaintiff_appearance: Plaintiff appearance and method
      plaintiff_counsel: Plaintiff counsel
      defendant_appearance: Defendant appearance and method
      defendant_counsel: Defendant counsel
      guardian_ad_litem_appearance: Guardian ad litem appearance
      matter_type: Hearing or matter type
      testimony_taken: Testimony-taken indicator
      hearing_notes: Narrative testimony or hearing notes
      outcome: Hearing outcome
      writ_granted: Writ-granted indicator
      continued_hearing_date: Continued hearing date
      continued_hearing_time: Continued hearing time
